<!DOCTYPE html>
<html>
  <head>
    <title>Exercici de POsició CSS</title>
    <style>
      /* Escriu aquí el teu codi per assolir la imatge de l?objectiu */
      body{
        margin: 0px;
      }
      .blue-box {
        position: absolute;
        background-color: blue;
        width: 500px;
        height: 300px;
        margin-top: 200px;
        margin-left: 200px;
      }
      .red-circle {
        width: 200px;
        height: 200px;
        background-color: red;
        border-radius: 50%;
        left: 250px;
        top: 150px;
        position: absolute;
      }
    </style>
  </head>

  <body>
    <div class="blue-box">
      <div class="red-circle"></div>
    </div>
  </body>
</html>
